[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonda-huawei"
version = "0.1.0"
description = "Multi-source latency and packet loss probe for Huawei VRP edge routers"
readme = "README.md"
license = { text = "BSD-2-Clause" }
authors = [
    { name = "Cleber Alves" }
]
requires-python = ">=3.8"
dependencies = [
    "netmiko>=4.2.0",
    "tabulate>=0.9.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/cleberalves40/Sonda-Huawei"
Repository = "https://github.com/cleberalves40/Sonda-Huawei.git"
Issues = "https://github.com/cleberalves40/Sonda-Huawei/issues"

[project.scripts]
sonda-huawei = "sonda_huawei.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sonda_huawei*"]

[tool.setuptools.package-data]
"*" = ["*.cfg"]

