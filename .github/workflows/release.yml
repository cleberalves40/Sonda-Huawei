name: Release and Distribution

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release tag against package version
        shell: bash
        run: |
          pyproject_ver=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          pkg_ver=$(python3 -c 'import sonda_huawei; print(sonda_huawei.__version__)')
          tag_ver="${GITHUB_REF_NAME#v}"

          echo "Tag:       $tag_ver"
          echo "pyproject: $pyproject_ver"
          echo "pkg:       $pkg_ver"

          if [ "$tag_ver" != "$pyproject_ver" ] || [ "$tag_ver" != "$pkg_ver" ]; then
            echo "::error::Tag version ($tag_ver) does not match pyproject ($pyproject_ver) or pkg ($pkg_ver)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python3 -m pip install --upgrade pip build
          python3 -m build

      - name: Compute Checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Sonda-Huawei $GITHUB_REF_NAME" \
            --generate-notes
