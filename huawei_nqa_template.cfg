# ==============================================================================
# Template de Configuração NQA (Network Quality Analysis) em Roteadores Huawei VRP
# Monitoramento Contínuo de Latência e Perda a Partir de Múltiplos IPs de Origem
# ==============================================================================

# 1. Habilitar NQA no roteador
nqa test-enable

# 2. Instância de Teste para o Link / Trânsito 1
nqa test-instance admin probe-transit-1
 test-type icmp-echo
 destination-address ipv4 8.8.8.8
 source-address ipv4 200.1.1.1
 frequency 30
 probe-count 5
 interval 1
 timeout 3
 start now

# 3. Instância de Teste para o Link / Trânsito 2
nqa test-instance admin probe-transit-2
 test-type icmp-echo
 destination-address ipv4 8.8.8.8
 source-address ipv4 200.2.2.2
 frequency 30
 probe-count 5
 interval 1
 timeout 3
 start now

# 4. Instância de Teste para o Link / Trânsito 3 (ex: IX / PTT)
nqa test-instance admin probe-ix-sp
 test-type icmp-echo
 destination-address ipv4 8.8.8.8
 source-address ipv4 200.3.3.3
 frequency 30
 probe-count 5
 interval 1
 timeout 3
 start now

# 5. Comandos úteis de visualização e troubleshooting:
# display nqa results admin probe-transit-1
# display nqa history admin probe-transit-1
